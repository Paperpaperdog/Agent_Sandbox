apiVersion: v1
kind: Namespace
metadata:
  name: ate-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: ate-registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      hostNetwork: true
      nodeSelector:
        kubernetes.io/hostname: @@CONTROL_PLANE_HOST@@
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: registry
        image: registry:2
        ports:
        - name: registry
          containerPort: 5000
        readinessProbe:
          httpGet:
            path: /v2/
            port: registry
          periodSeconds: 2
        volumeMounts:
        - name: data
          mountPath: /var/lib/registry
      volumes:
      - name: data
        hostPath:
          path: @@DATA_ROOT@@/registry
          type: Directory
